name: CI

# I test girano a ogni push, su qualunque branch, cosi' il check e' verde (o
# rosso) prima del merge e non dopo. L'immagine invece si costruisce solo
# dove serve davvero: main, tag v*, o una PR con la label build-docker.
on:
  push:
  pull_request:
    types: [labeled]

env:
  IMAGE_NAME: araroma/crac-cloud

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Python tests
        run: uv run pytest
        timeout-minutes: 10

      # Nessun package.json: il runner e' quello della stdlib di Node.
      - name: Run JS tests
        run: node --test tests/js/
        timeout-minutes: 5

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-docker'))
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    runs-on: ubuntu-latest
    needs: [test, build-and-push]
    if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-docker')
    permissions:
      pull-requests: write

    steps:
      - name: Remove build-docker label
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'build-docker'
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
